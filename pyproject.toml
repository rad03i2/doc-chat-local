[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-chat-local"
version = "1.0.0"
description = "Private local document search and extractive Q&A with source citations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
doc-chat = "doc_chat_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
